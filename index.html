      .main{padding:12px}
      .card{border-radius:12px;padding:16px}
      .section-header{margin-bottom:12px}
      .section-header h2{font-size:16px}
      .header-balance{font-size:14px}
      .header-balance strong{font-size:18px}
    }
    
    /* Móvil: Tablas */
    @media(max-width:640px){
      .expiring-table{font-size:11px}
      .expiring-table th,.expiring-table td{padding:10px 12px}
      .account-data{max-width:160px;font-size:10px}
      .movements-card .expiring-table{font-size:10px}
      .movements-card .expiring-table th,.movements-card .expiring-table td{padding:10px}
    }
    
    /* Móvil: Botones */
    @media(max-width:480px){
      .btn{padding:10px 16px;font-size:13px;border-radius:10px}
      .order-btn{padding:10px 14px;font-size:12px}
      .primary{padding:12px 20px;font-size:14px}
      .premium-metrics{grid-template-columns:repeat(2,1fr);gap:10px}
      .premium-card{min-height:120px;padding:16px 10px}
      .premium-orb-wrap{width:48px;height:48px}
      .premium-num{font-size:20px}
      .premium-label{font-size:9px}
      .home-header{padding:12px 0}
      .home-header h1{font-size:18px}
      .carousel-slide{padding:16px}
      .carousel-slide h3{font-size:15px}
      .carousel-arrow{width:30px;height:30px;font-size:16px}
      .saldo-card{padding:16px;border-radius:14px}
      .saldo-amount{font-size:22px}
      .quick-actions{grid-template-columns:repeat(3,1fr);gap:8px}
      .quick-action{padding:12px 6px}
      .quick-action-icon{width:36px;height:36px}
      .quick-action-label{font-size:10px}
      .expiring-card{border-radius:14px}
      .expiring-card .card-header{padding:12px}
      .expiring-card .card-header h2{font-size:14px}
      .expiring-table{font-size:11px}
      .expiring-table th,.expiring-table td{padding:8px 10px}
    }
    
    /* Móvil: Modales */
    @media(max-width:480px){
      .modal-content,.modal-box{max-width:95%;margin:10px;padding:16px;border-radius:12px}
      .modal-header h2{font-size:16px}
    }
    
    /* Oscuro: Premium cards */
    body.dark .premium-card{background:var(--panel);border-color:var(--line)}
    body.dark .premium-label{color:var(--muted)}
    body.dark .premium-num{color:var(--blue)}
    
    /* Oscuro: Tienda */
    body.dark .product{background:var(--panel);border-color:var(--line);box-shadow:0 4px 12px rgba(0,0,0,.2)}
    body.dark .product:hover{box-shadow:0 20px 40px rgba(0,0,0,.3),0 0 20px rgba(8,119,255,.1)}
    body.dark .product h3{color:var(--text)}
    body.dark .product .price{color:#00d4ff;text-shadow:0 0 15px rgba(0,212,255,.4)}
    body.dark .product .divider{background:linear-gradient(90deg,transparent,var(--line),transparent)}
    body.dark .poster{background:linear-gradient(180deg,rgba(8,119,255,.08),transparent)}
    body.dark .store-grid{ gap:16px }
    body.dark .product .mini{color:var(--muted)}
    
    .report-status{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:10px 0}

    /* ═══════════════════════════════════════════════════════
       EFFECTS SYSTEM - Premium Visual Effects
       ═══════════════════════════════════════════════════════ */

    /* ─── AMBIENT BACKGROUND ─── */
    .app-bg{position:relative;overflow:hidden}
    .app-bg::before{content:"";position:fixed;top:-50%;left:-50%;width:200%;height:200%;background:radial-gradient(circle at 30% 20%,rgba(8,119,255,.04) 0%,transparent 50%),radial-gradient(circle at 70% 80%,rgba(8,119,255,.03) 0%,transparent 50%);animation:ambientFloat 20s ease-in-out infinite;pointer-events:none;z-index:-1}
    @keyframes ambientFloat{0%,100%{transform:translate(0,0) rotate(0deg)}25%{transform:translate(2%,1%) rotate(1deg)}50%{transform:translate(-1%,2%) rotate(-1deg)}75%{transform:translate(1%,-1%) rotate(0.5deg)}}

    /* ─── PAGE TRANSITIONS ─── */
    .main{animation:pageIn .4s cubic-bezier(.2,.8,.2,1)}
    @keyframes pageIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
    .card,.list-row,.product,.quick-btn{animation:elementIn .5s cubic-bezier(.2,.8,.2,1) backwards}
    .card:nth-child(1){animation-delay:.05s}
    .card:nth-child(2){animation-delay:.1s}
    .card:nth-child(3){animation-delay:.15s}
    @keyframes elementIn{from{opacity:0;transform:translateY(16px) scale(.98)}to{opacity:1;transform:none}}

    /* ─── CARD HOVER EFFECTS ─── */
    .card{transition:all .3s cubic-bezier(.2,.8,.2,1)}
    .card:hover{transform:translateY(-4px) scale(1.01);box-shadow:0 20px 40px rgba(8,119,255,.1)}
    body.dark .card:hover{box-shadow:0 20px 40px rgba(0,0,0,.25),0 0 0 1px rgba(8,119,255,.1)}

    /* ─── PRODUCT 3D TILT ─── */
    .product{transform-style:preserve-3d;perspective:1000px}
    .product:hover{transform:translateY(-8px) rotateX(2deg) rotateY(-2deg);box-shadow:0 25px 60px rgba(8,119,255,.25),0 0 40px rgba(8,119,255,.1)}

    /* ─── BUTTON RIPPLE EFFECT ─── */
    .primary,.ok-btn,.quick-btn{position:relative;overflow:hidden}
    .primary::before,.ok-btn::before,.quick-btn::before{content:"";position:absolute;top:50%;left:50%;width:0;height:0;background:rgba(255,255,255,.25);border-radius:50%;transform:translate(-50%,-50%);transition:width .5s,height .5s}
    .primary:active::before,.ok-btn:active::before,.quick-btn:active::before{width:300px;height:300px}

    /* ─── GLOW EFFECTS ─── */
    .primary{box-shadow:0 8px 24px rgba(8,119,255,.25),0 0 0 0 rgba(8,119,255,0)}
    .primary:hover{box-shadow:0 12px 32px rgba(8,119,255,.35),0 0 20px rgba(8,119,255,.2)}
    .product .primary{box-shadow:0 8px 24px rgba(0,212,255,.25),0 0 0 0 rgba(0,212,255,0)}
    .product .primary:hover{box-shadow:0 12px 32px rgba(0,212,255,.4),0 0 25px rgba(0,212,255,.2)}

    /* ─── SUCCESS ANIMATION ─── */
    .success-pulse{animation:successBounce .6s cubic-bezier(.68,-.55,.265,1.55)}
    @keyframes successBounce{0%{transform:scale(0)}50%{transform:scale(1.2)}100%{transform:scale(1)}}
    .toast.ok{animation:toastSlideIn .4s cubic-bezier(.2,.8,.2,1)}
    @keyframes toastSlideIn{from{opacity:0;transform:translateX(-50%) translateY(20px) scale(.9)}to{opacity:1;transform:translateX(-50%) translateY(0) scale(1)}}

    /* ─── ICON MICRO-INTERACTIONS ─── */
    .nav button svg,.quick-btn svg,.profile-action svg{transition:all .2s ease}
    .nav button:hover svg,.quick-btn:hover svg{transform:scale(1.15)}
    .nav button:active svg,.quick-btn:active svg{transform:scale(.95)}

    /* ─── TAG ANIMATIONS ─── */
    .tag{transition:all .2s cubic-bezier(.2,.8,.2,1)}
    .tag:hover{transform:scale(1.05)}
    .notice-dot{animation:noticePulse 2s ease-in-out infinite}
    @keyframes noticePulse{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}

    /* ─── MODAL ANIMATIONS ─── */
    .dialog{animation:modalIn .35s cubic-bezier(.2,.8,.2,1)}
    @keyframes modalIn{from{opacity:0;transform:translateY(24px) scale(.95)}to{opacity:1;transform:none}}
    .modal.show{animation:modalOverlay .3s ease}
    @keyframes modalOverlay{from{opacity:0}to{opacity:1}}

    /* ─── LOADING SKELETON GLOW ─── */
    .skeleton{position:relative;overflow:hidden}
    .skeleton::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.08),transparent);animation:skeletonGlow 2s infinite}
    @keyframes skeletonGlow{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}

    /* ─── GRADIENT BORDER EFFECT ─── */
    .product{background:#fff;border:none;position:relative}
    .product::before{content:"";position:absolute;inset:0;border-radius:20px;padding:1px;background:linear-gradient(135deg,rgba(8,119,255,.15),rgba(8,119,255,.06),rgba(8,119,255,.02));-webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
    .product:hover::before{background:linear-gradient(135deg,rgba(8,119,255,.3),rgba(8,119,255,.12),rgba(8,119,255,.05))}
    body.dark .product{background:linear-gradient(180deg,#12253b,#0d1d31);border:none}
    body.dark .product::before{background:linear-gradient(135deg,rgba(0,212,255,.2),rgba(8,119,255,.1),rgba(0,212,255,.05))}
    body.dark .product:hover::before{background:linear-gradient(135deg,rgba(0,212,255,.35),rgba(8,119,255,.15),rgba(0,212,255,.08))}

    /* ─── PULSE RING EFFECT ─── */
    .avatar{position:relative}
    .avatar::after{content:"";position:absolute;inset:-3px;border-radius:14px;border:2px solid rgba(8,119,255,.3);animation:avatarRing 3s ease-in-out infinite}
    @keyframes avatarRing{0%,100%{opacity:.3;transform:scale(1)}50%{opacity:.6;transform:scale(1.02)}}

    /* ─── FLOATING LABELS ─── */
    .form label{transition:all .2s ease}
    .form label:focus-within{color:var(--blue);transform:translateX(4px)}

    /* ─── SCROLL PROGRESS ─── */
    .main{scrollbar-width:thin;scrollbar-color:rgba(8,119,255,.3) transparent}
    .main::-webkit-scrollbar{width:6px}
    .main::-webkit-scrollbar-thumb{background:rgba(8,119,255,.3);border-radius:999px}
    .main::-webkit-scrollbar-thumb:hover{background:rgba(8,119,255,.5)}

    /* ─── LOADING MINIMALISTA ─── */
    .loading-overlay{position:fixed!important;inset:0!important;background:#0a0f1a!important;display:none!important;align-items:center!important;justify-content:center!important;z-index:99999!important;overflow:hidden}
    .loading-overlay.show{display:flex!important}
    .loader-content{position:relative;display:flex;flex-direction:column;align-items:center;gap:24px;z-index:2}
    
    /* Logo simple */
    .loader-logo-wrap{width:80px;height:80px;border-radius:20px;background:linear-gradient(135deg,#0877ff,#7c3aed);display:flex;align-items:center;justify-content:center;box-shadow:0 8px 32px rgba(8,119,255,.3)}

    /* Barra de progreso simple */
    .loader-bar{width:200px;height:4px;background:rgba(255,255,255,.1);border-radius:4px;overflow:hidden}
    .loader-bar-fill{height:100%;background:linear-gradient(90deg,#0877ff,#00d4ff);border-radius:4px;animation:loaderProgress 1.5s ease-in-out infinite;width:0}
    @keyframes loaderProgress{0%{width:0%;margin-left:0%}50%{width:60%;margin-left:20%}100%{width:0%;margin-left:100%}}
    
    .loader-text{color:rgba(255,255,255,.7);font-size:14px;font-weight:500}

    .loader-dots span{width:7px;height:7px;border-radius:50%;background:#0877ff;animation:dotBounce .6s ease-in-out infinite}
    .loader-dots span:nth-child(1){animation-delay:0s}

    @keyframes dotBounce{0%,80%,100%{transform:scale(0);opacity:.3}40%{transform:scale(1.4);opacity:1}}

    /* Progress bar */
    .loader-progress{width:180px;height:3px;background:rgba(255,255,255,.06);border-radius:999px;overflow:hidden;position:relative;z-index:3}
    .loader-progress-bar{height:100%;width:0;background:linear-gradient(90deg,#0877ff,#00d4ff,#7c3aed,#0877ff);background-size:300% 100%;border-radius:999px;transition:width .2s ease;animation:progressShimmer .8s linear infinite;box-shadow:0 0 10px rgba(0,212,255,.5)}
    @keyframes progressShimmer{0%{background-position:0% 0}100%{background-position:300% 0}}

    /* ─── SKELETON LOADERS ─── */
    .skeleton{background:linear-gradient(90deg,var(--soft) 25%,rgba(8,119,255,.08) 50%,var(--soft) 75%);background-size:200% 100%;animation:shimmer 1.5s infinite;border-radius:8px}

    /* ─── OFFLINE BANNER ─── */
    .offline-banner{display:none;position:fixed;top:0;left:0;right:0;background:#ef4444;color:#fff;text-align:center;padding:8px;font-size:12px;font-weight:700;z-index:200}

    /* ─── PULL TO REFRESH ─── */
    .pull-indicator{position:fixed;top:0;left:50%;transform:translateX(-50%) translateY(-60px);width:40px;height:40px;border-radius:50%;background:var(--panel);border:2px solid var(--blue);display:flex;align-items:center;justify-content:center;z-index:35;transition:transform .3s ease;box-shadow:0 4px 12px rgba(0,0,0,.15)}
    .pull-indicator.show{transform:translateX(-50%) translateY(16px)}
    .pull-indicator.refreshing{transform:translateX(-50%) translateY(16px)}
    .pull-indicator svg{width:20px;height:20px;stroke:var(--blue);transition:transform .3s}
    .pull-indicator.refreshing svg{animation:spin .8s linear infinite}
    .pull-text{position:fixed;top:60px;left:50%;transform:translateX(-50%) translateY(-20px);background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:6px 14px;font-size:11px;font-weight:700;color:var(--muted);z-index:35;opacity:0;transition:all .3s;white-space:nowrap;box-shadow:0 4px 12px rgba(0,0,0,.1)}

    .ad-category.urgente{background:rgba(239,68,68,.12);color:#ef4444}

    /* ─── PANEL ADMIN IMPROVEMENTS ─── */
    .today-summary{background:linear-gradient(135deg,rgba(8,119,255,.08),rgba(8,119,255,.02));border:1.5px solid rgba(8,119,255,.15);border-radius:var(--radius);padding:18px 20px;display:flex;align-items:center;gap:16px;margin-bottom:16px}

    .quick-action-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}

    .reseller-rank .amount{font-size:14px;font-weight:1000;color:var(--blue)}
    .alert-urgent{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:10px;margin-bottom:8px;border-left:4px solid}

    .goal-progress .labels{display:flex;justify-content:space-between;margin-top:4px;font-size:10px;color:var(--muted)}

    .comparison-badge.down{background:rgba(239,68,68,.12);color:#ef4444}
    
    /* ─── TOPUP METRIC CARDS ─── */
    .topup-metric-card{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:20px;text-align:center;overflow:hidden;transition:all .3s cubic-bezier(.4,0,.2,1)}
    .topup-metric-card::before{content:'';position:absolute;top:0;left:0;right:0;height:4px;transition:height .3s}
    .topup-metric-card:hover{transform:translateY(-4px);box-shadow:0 12px 40px rgba(0,0,0,.15)}
    .topup-metric-card:hover::before{height:6px}
    .topup-metric-card.pending{border-color:rgba(245,158,11,.3)}
    .topup-metric-card.pending::before{background:linear-gradient(90deg,#f59e0b,#fbbf24)}
    .topup-metric-card.pending:hover{background:linear-gradient(180deg,rgba(245,158,11,.08),var(--panel))}
    .topup-metric-card.approved{border-color:rgba(16,185,129,.3)}
    .topup-metric-card.approved::before{background:linear-gradient(90deg,#10b981,#34d399)}
    .topup-metric-card.approved:hover{background:linear-gradient(180deg,rgba(16,185,129,.08),var(--panel))}
    .topup-metric-card.rejected{border-color:rgba(239,68,68,.3)}
    .topup-metric-card.rejected::before{background:linear-gradient(90deg,#ef4444,#f87171)}
    .topup-metric-card.rejected:hover{background:linear-gradient(180deg,rgba(239,68,68,.08),var(--panel))}
    .topup-metric-card.profit{border-color:rgba(124,58,237,.3)}
    .topup-metric-card.profit::before{background:linear-gradient(90deg,#7c3aed,#a78bfa)}
    .topup-metric-card.profit:hover{background:linear-gradient(180deg,rgba(124,58,237,.08),var(--panel))}
    .topup-metric-card.blue{border-color:rgba(8,119,255,.3)}
    .topup-metric-card.blue::before{background:linear-gradient(90deg,#0877ff,#00d4ff)}
    .topup-metric-card.blue:hover{background:linear-gradient(180deg,rgba(8,119,255,.08),var(--panel))}
    .topup-metric-card.blue .metric-glow{background:radial-gradient(circle,#0877ff,transparent 70%)}
    .topup-metric-card.blue .metric-badge{background:rgba(8,119,255,.2);color:#0877ff}
    .metric-glow{position:absolute;top:-50%;left:-50%;width:200%;height:200%;opacity:.05;pointer-events:none;transition:opacity .3s}
    .topup-metric-card:hover .metric-glow{opacity:.1}
    .topup-metric-card.pending .metric-glow{background:radial-gradient(circle,#f59e0b,transparent 70%)}
    .topup-metric-card.approved .metric-glow{background:radial-gradient(circle,#10b981,transparent 70%)}
    .topup-metric-card.rejected .metric-glow{background:radial-gradient(circle,#ef4444,transparent 70%)}
    .topup-metric-card.profit .metric-glow{background:radial-gradient(circle,#7c3aed,transparent 70%)}
    .metric-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px}
    .metric-icon{font-size:24px;animation:float 3s ease-in-out infinite}
    @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
    .metric-badge{background:var(--soft);padding:4px 10px;border-radius:20px;font-size:12px;transition:all .3s}
    .metric-badge.active{background:rgba(245,158,11,.2);color:#f59e0b;animation:pulse-badge 2s infinite}
    @keyframes pulse-badge{0%,100%{box-shadow:0 0 0 0 rgba(245,158,11,.4)}50%{box-shadow:0 0 0 6px rgba(245,158,11,0)}}
    .approved-badge{background:rgba(16,185,129,.2);color:#10b981}
    .rejected-badge{background:rgba(239,68,68,.2);color:#ef4444}
    .profit-badge{background:rgba(124,58,237,.2);color:#7c3aed}
    .metric-value{font-size:36px;font-weight:900;color:var(--text);line-height:1;margin-bottom:4px;text-shadow:0 2px 10px rgba(0,0,0,.1)}
    .metric-value.success{color:#10b981}
    .metric-value.danger{color:#ef4444}
    .metric-value.profit-value{font-size:24px;background:linear-gradient(135deg,#7c3aed,#a78bfa);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
    .metric-label{font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
    .metric-detail{font-size:12px;color:var(--muted)}
    .metric-sub{font-size:10px;color:var(--muted);margin-top:4px}
    .metric-progress{margin-top:12px;height:4px;background:var(--soft);border-radius:4px;overflow:hidden}
    .metric-progress.success .progress-bar{background:linear-gradient(90deg,#10b981,#34d399)}
    .progress-bar{height:100%;background:linear-gradient(90deg,#f59e0b,#fbbf24);border-radius:4px;transition:width .5s ease}
    .metric-action{margin-top:12px;font-size:11px;font-weight:600;color:var(--blue);opacity:0;transform:translateY(4px);transition:all .3s}
    .topup-metric-card:hover .metric-action{opacity:1;transform:translateY(0)}
    .metric-trend{margin-top:8px;font-size:11px;font-weight:600;padding:4px 8px;border-radius:6px;display:inline-block}
    .metric-trend.positive{background:rgba(16,185,129,.15);color:#10b981}
    .metric-trend.negative{background:rgba(239,68,68,.15);color:#ef4444}

    /* ===== RESPONSIVE MOBILE PREMIUM ===== */
    @media (max-width: 768px) {
      /* Tarjetas de métricas en grid 2x2 */
      .topup-metric-card { padding: 14px; border-radius: 16px; }
      .metric-value { font-size: 28px; }
      .metric-label { font-size: 11px; }
      .metric-icon { font-size: 20px; }
      
      /* Tabla de actividad como cards */
      .activity-table-wrap { 
        overflow: visible !important; 
        -webkit-overflow-scrolling: touch;
      }
      .activity-table-wrap table { 
        display: none; 
      }
      .activity-cards {
        display: flex !important;
        flex-direction: column;
        gap: 10px;
        padding: 12px;
      }
      .activity-card-mobile {
        background: var(--panel);
