# Configuracion del proyecto Supabase para Distrito Streaming.
# Referencia: https://supabase.com/docs/guides/cli/config
project_id = "distri-streaming"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "graphql_public"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[inbucket]
enabled = true
port = 54324
smtp_port = 54325
pop3_port = 54326
admin_email = "admin@email.com"
sender_name = "Admin"

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "https://distrito-streaming-vercel-ashen.vercel.app"
additional_redirect_urls = ["https://distrito-streaming.vercel.app"]
jwt_expiry = 3600
enable_refresh_token = true
refresh_token_reuse_interval = 10
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = false
enable_confirmations = false

[auth.sms]
enable_signup = true
twilio_verify_enabled = true

[edge_runtime]
enabled = true
policy = "per_worker"
inspector_port = 8083

